name: Build Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tag and stamp version
        run: bash .github/scripts/stamp-release-version.sh "$GITHUB_REF_NAME"

      - name: Check tag commit is on main
        run: |
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "Refusing release tag '$GITHUB_REF_NAME': commit $(git rev-parse HEAD) is not on main" >&2
            exit 1
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          extensions: dom, mbstring, simplexml, tokenizer, xml, xmlwriter
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run unit tests
        run: php vendor/bin/phpunit -c phpunit-unit.xml

      - name: Verify release ZIP
        run: bash .github/scripts/verify-release-zip.sh

      - name: Build plugin ZIP
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          mkdir -p build/bricks-mcp
          rsync -a \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='vendor' \
            --exclude='docs' \
            --exclude='mu-plugins' \
            --exclude='logs' \
            --exclude='tests' \
            --exclude='.planning' \
            --exclude='.wp-env.json' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='composer.json' \
            --exclude='composer.lock' \
            --exclude='phpunit.xml' \
            --exclude='phpunit-unit.xml' \
            --exclude='phpcs.xml' \
            --exclude='.editorconfig' \
            --exclude='.gitignore' \
            --exclude='build' \
            --exclude='.github' \
            --exclude='update-server' \
            --exclude='.claude' \
            --exclude='README.md' \
            --exclude='.wordpress-org' \
            --exclude='.distignore' \
            --exclude='.phpunit.cache' \
            ./ build/bricks-mcp/
          cd build && zip -r "bricks-mcp.zip" bricks-mcp/

      - name: Generate SHA-256 checksum
        run: |
          cd build
          sha256sum bricks-mcp.zip > bricks-mcp.zip.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/bricks-mcp.zip
            build/bricks-mcp.zip.sha256
          generate_release_notes: true
