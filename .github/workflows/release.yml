name: Build Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Stamp version from tag
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "Stamping version: $VERSION"
          sed -i "s/^ \* Version:.*/ * Version:           $VERSION/" bricks-mcp.php
          sed -i "s/define( 'BRICKS_MCP_VERSION', '.*' );/define( 'BRICKS_MCP_VERSION', '$VERSION' );/" bricks-mcp.php
          sed -i "s/^Stable tag:.*/Stable tag: $VERSION/" readme.txt
          grep 'Version:' bricks-mcp.php | head -1
          grep 'BRICKS_MCP_VERSION' bricks-mcp.php | head -1
          grep 'Stable tag:' readme.txt | head -1

      - name: Build plugin ZIP
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          mkdir -p build/bricks-mcp
          rsync -a \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='vendor' \
            --exclude='docs' \
            --exclude='mu-plugins' \
            --exclude='logs' \
            --exclude='tests' \
            --exclude='.planning' \
            --exclude='.wp-env.json' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='composer.json' \
            --exclude='composer.lock' \
            --exclude='phpunit.xml' \
            --exclude='phpunit-unit.xml' \
            --exclude='phpcs.xml' \
            --exclude='.editorconfig' \
            --exclude='.gitignore' \
            --exclude='build' \
            --exclude='.github' \
            --exclude='update-server' \
            --exclude='.claude' \
            --exclude='README.md' \
            --exclude='.wordpress-org' \
            --exclude='.distignore' \
            ./ build/bricks-mcp/
          cd build && zip -r "bricks-mcp.zip" bricks-mcp/

      - name: Generate SHA-256 checksum
        run: |
          cd build
          sha256sum bricks-mcp.zip > bricks-mcp.zip.sha256

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/bricks-mcp.zip \
            build/bricks-mcp.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes
